# Omarchy WWAN (mobile broadband) configuration
# Read by omarchy-wwan / omarchy-wwan-helper.
# Plain KEY=VALUE lines only — this file is parsed, never sourced as shell.

# Access Point Name. All four Polish operators (Plus, Play, Orange, T-Mobile)
# use "internet". Change if your carrier requires something else.
APN=internet

# ipv4 | ipv6 | ipv4v6
IP_TYPE=ipv4v6

# Which SIM slot to make primary on connect.
#   1 = physical SIM card (the tray on the side of the 9430)
#   2 = built-in eSIM
# Leave empty to never touch the slot selection.
SIM_SLOT=1

# Optional APN credentials (most carriers need neither).
APN_USER=
APN_PASS=

# SIM PIN. Leave empty if the card has no PIN.
# NOTE: this file is chmod 600 — still, prefer disabling the PIN on the card.
PIN=

# Default-route metric — this is what makes Wi-Fi win over mobile data.
# Omarchy uses 20 for ethernet and 600 for Wi-Fi; the lowest metric wins, so at
# 700 the modem only carries traffic when nothing better has a default route.
# Drop Wi-Fi and failover to mobile is instant (the modem stays connected);
# reconnect Wi-Fi and traffic moves straight back. Raising this above 600 is the
# whole mechanism — do not set it below the Wi-Fi metric.
ROUTE_METRIC=700

# Allow data while roaming (yes|no).
ALLOW_ROAMING=yes

# Force registration to one operator by MCC+MNC, e.g. 26006 for Play.
# Leave empty to let the modem choose.
OPERATOR_ID=

# Let the modem connect automatically at boot (yes|no).
# Changing this needs `omarchy-wwan autoconnect on|off` to take effect.
AUTOCONNECT=yes

# Data cap with auto-cutoff: mobile data disconnects when this much traffic
# has been used in the current billing period. Examples: 5G, 1.5G, 500M.
# "off" disables the cutoff; usage is tracked and shown either way.
DATA_LIMIT=off

# Billing period for the cap: monthly or daily.
DATA_PERIOD=monthly

# Day of the month the package renews and the counter resets (1-31; days
# past the end of a short month clamp to its last day).
DATA_RESET_DAY=1
